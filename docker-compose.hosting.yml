services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]

  api:
    build:
      context: ./server/pdf-parser
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      NODE_ENV: production
      TRUST_PROXY: ${TRUST_PROXY:-1}
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?set PUBLIC_APP_URL}
      CORS_ORIGIN: ${CORS_ORIGIN:?set CORS_ORIGIN}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_ENDPOINT: ${S3_ENDPOINT:?set S3_ENDPOINT}
      S3_REGION: ${S3_REGION:?set S3_REGION}
      S3_BUCKET_RAW: ${S3_BUCKET_RAW:?set S3_BUCKET_RAW}
      S3_BUCKET_PROCESSED: ${S3_BUCKET_PROCESSED:?set S3_BUCKET_PROCESSED}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:?set S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:?set S3_SECRET_ACCESS_KEY}
      S3_FORCE_PATH_STYLE: ${S3_FORCE_PATH_STYLE:-false}
      S3_PRESIGNED_UPLOAD_TTL_SEC: ${S3_PRESIGNED_UPLOAD_TTL_SEC:-900}
      S3_PRESIGNED_DOWNLOAD_TTL_SEC: ${S3_PRESIGNED_DOWNLOAD_TTL_SEC:-900}
      PARSER_MAX_FILE_MB: ${PARSER_MAX_FILE_MB:-30}
      PARSER_JOB_TIMEOUT_MS: ${PARSER_JOB_TIMEOUT_MS:-120000}
      LLM_PROVIDER: ${LLM_PROVIDER:-gigachat}
      NODE_TLS_REJECT_UNAUTHORIZED: ${NODE_TLS_REJECT_UNAUTHORIZED:-0}
      GIGA_CHAT_ACCESS_KEY: ${GIGA_CHAT_ACCESS_KEY:-}
      OAUTH_TOKEN: ${OAUTH_TOKEN:-}
      FOLDER_ID: ${FOLDER_ID:-}
      BEARER_TOKEN: ${BEARER_TOKEN:-}
    volumes:
      - api_uploads:/app/uploads
      - api_storage_tmp:/app/storage
    depends_on:
      redis:
        condition: service_started
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:3003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s

  web:
    build:
      context: ./client/pdf-parser-ui
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
        VITE_USE_MOCK_API: "false"
        VITE_USE_MOCK_ADMIN_API: "false"
        VITE_USE_MOCK_PROFILE_API: "false"
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-80}:80"

volumes:
  redis_data:
  api_uploads:
  api_storage_tmp:
